name: Build NIKKE Toolkit APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Nikke_Translation_Toolkit_Android_Source_v0.4.0.zip'
      - '.github/workflows/build-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "Nikke_Translation_Toolkit_Android_Source_v0.4.0.zip" -d extracted_project

      - name: Find project root
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project root not found: settings.gradle/settings.gradle.kts is missing."
            find extracted_project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.project.outputs.dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "APK was not created."
            find "${{ steps.project.outputs.dir }}" -type f -name '*.apk' -print
            exit 1
          fi
          echo "file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "APK: $APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Translation-Toolkit-v0.4.0-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30
